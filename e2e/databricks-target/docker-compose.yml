# Sail + spark-agent only. Ports sit above the dbt/sql bands.
services:
  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_ENGINE_VERSION:-0.7.0}@${SAIL_ENGINE_DIGEST:-sha256:0d2fe3c7a5a844c939f23ef0930e293e131da10ec0c3ff41022b1e1e4ab77ce2}
    ports:
      - "15054:50051"
    environment:
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 3s
      timeout: 2s
      retries: 30

  spark-agent:
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_CLIENT_VERSION:-4.2.0}@${SPARK_CLIENT_DIGEST:-sha256:7af93f6d5d1c4588bf535db785dab6f7fcd02a2efd60d4991c0c6593005ee16d}
    depends_on:
      sail:
        condition: service_healthy
    ports:
      - "18104:8099"
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30
