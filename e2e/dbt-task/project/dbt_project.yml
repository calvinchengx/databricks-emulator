name: emulator_dbt_task
version: "1.0.0"
config-version: 2
profile: emulator_dbt_task
model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
# The profile name IS free, and this fixture is what proves it. dbt_task
# generates the profile itself, and it once filed it under a fixed key --
# so the only projects that ran here were the ones edited to say that key,
# an edit that makes a project emulator-only on the one surface whose whole
# purpose is rehearsing the real Databricks. It now keys the generated profile
# by whatever `profile:` this file declares.
#
# So this name is deliberately NOT the emulator's default: a project named
# `databricks_emulator` would pass whether or not the name travels, and prove
# nothing. See TestDbtProfileIsKeyedByTheProjectsOwnName for the unit half.
#
# v2 builds a temp view then INSERT BY NAME. The classic path is
# CREATE OR REPLACE TABLE … AS SELECT, which is the SQL this attach runs.
flags:
  send_anonymous_usage_stats: false
  use_materialization_v2: false
query-comment: ""
models:
  emulator_dbt_task:
    +materialized: table
    +file_format: delta
    # dbt's tables live in Sail's in-process catalog, where only Sail can read
    # them -- which would leave "the run said SUCCESS" as the only evidence.
    # Each model publishes an external Delta copy onto the mounted volume, and
    # delta-rs reads that back without ever speaking to dbt, to the agent, or
    # to Sail. See e2e/dbt for why this is a post-hook copy and not
    # +location_root.
    +post-hook: "create or replace table `{{ this.identifier }}__witness` using delta location 'file:///data/dbt/{{ this.identifier }}' as select * from {{ this }}"
