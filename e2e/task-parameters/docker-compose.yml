# Sail + spark-agent. The two tasks write Delta straight from the agent with
# delta-rs, so Sail is here only because the agent expects an engine behind it.
# Ports sit above the condition-task band.
services:
  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_ENGINE_VERSION:-0.7.1}@${SAIL_ENGINE_DIGEST:-sha256:0b37f65f41da5d9493f3e5a5479a622b14ba6ca51492b5a0ab886ed1ffcbb430}
    ports:
      - "15057:50051"
    environment:
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"
      RUST_LOG: "info"
    volumes:
      - ${PARAMS_DATA}:/data/params
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 3s
      timeout: 2s
      retries: 30

  spark-agent:
    # PINNED TO THE UNFIXED AGENT, deliberately, until the digest bumps: this
    # suite FAILS against it, which is what makes it a regression test rather
    # than a description. See run.py's module docstring.
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_CLIENT_VERSION:-4.2.0}@${SPARK_CLIENT_DIGEST:-sha256:04509791f172cf11fd08b5aa7277af64079a8d142e9abdfda222aef9ee347bd9}
    depends_on:
      sail:
        condition: service_healthy
    ports:
      - "18107:8099"
    environment:
      SPARK_REMOTE: "sc://sail:50051"
    volumes:
      - ${PARAMS_DATA}:/data/params
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30
