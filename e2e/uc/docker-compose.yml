# Unity Catalog OSS sidecar for the catalog CRUD parity row.
# Pin the tag: a floating :latest is not a witness.
services:
  uc:
    image: unitycatalog/unitycatalog:${UC_VERSION:-v0.5.0}
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s
