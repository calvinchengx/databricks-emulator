[project]
name = "databricks-emulator-python"
version = "0.1.0"
description = "Locked Python tooling and end-to-end witnesses for databricks-emulator"
requires-python = ">=3.12"
dependencies = []

# Named groups, same shape as fabric-emulator: each e2e that needs a
# stranger client declares it here and locks it in uv.lock. A floating
# `pip install databricks-sdk` is not a witness.
[dependency-groups]
sdk = [
    "databricks-sdk==0.129.0",
]
# databricks-connect 19.1 Requires-Python ==3.12.*
engine = [
    { include-group = "sdk" },
    "databricks-connect==19.1",
]
# Confirmer is delta-rs, not Sail. Same pin family as fabric's delta-rs group.
delta = [
    { include-group = "sdk" },
    "deltalake==0.25.5",
]
sql = [
    { include-group = "sdk" },
    "databricks-sql-connector==4.4.0",
]
# The consumer toggle. Path-sourced so CI and a checkout run the same
# package a release wheel will contain. pytest is the unit suite; the
# e2e drives workspace_client() through the locked SDK pin.
target = [
    "databricks-target",
    "databricks-sdk==0.129.0",
    "pytest>=8.3,<10",
]
# dbt-databricks 1.12.4 pins databricks-sdk<0.118 and
# databricks-sql-connector[pyarrow]<4.4.1. Do not include-group sdk.
dbt = [
    "dbt-databricks==1.12.4",
    "deltalake==0.25.5",
]

[tool.uv]
package = false
# sqlparse reaches this lock ONLY through dbt-core, which declares
# `sqlparse<0.6.0,>=0.5.5`. Four advisories (GHSA-prg7-hcfm-mfcr,
# GHSA-pwgv-4x5q-6m9f, GHSA-f2ff-p2ww-7p4p, GHSA-3496-9g83-7v6x) all name
# 0.6.0 as the first patched version, so there is no dbt release to upgrade
# INTO that takes a fixed sqlparse: the choice is this override or living with
# them. A constraint cannot do it -- narrowing cannot satisfy `<0.6.0` and
# `>=0.6.0` at once -- so the maintainer's upper bound has to be overridden.
#
# Overriding an upper bound is a deliberate deviation. fabric-emulator measured
# it first (dbt touches sqlparse only in `dbt/compilation.py`, and
# `inject_ctes_into_sql` returns byte-identical output under 0.5.5 and 0.6.0),
# and here it is additionally exercised end to end by e2e-dbt and e2e-dbt-uc,
# which run real dbt from THIS lock. e2e-dbt-task is deliberately not on that
# list: its dbt lives in the spark-agent image and its suite asserts the host
# has none, so it says nothing about the sqlparse resolved here.
#
# Re-check when dbt-core relaxes the bound: this override should then be
# DELETED rather than left to pin the ecosystem quietly.
override-dependencies = ["sqlparse>=0.6.0"]
# 1.12.4 needs databricks-sdk<0.118; the other groups pin 0.129.0.
conflicts = [
    [
        { group = "sdk" },
        { group = "dbt" },
    ],
    # target pins databricks-sdk==0.129.0 directly, so it is mutually
    # exclusive with dbt for the same reason the others are. Neither branch
    # needed this pair; it exists only because both groups now do.
    [
        { group = "target" },
        { group = "dbt" },
    ],
    [
        { group = "engine" },
        { group = "dbt" },
    ],
    [
        { group = "delta" },
        { group = "dbt" },
    ],
    [
        { group = "sql" },
        { group = "dbt" },
    ],
]

[tool.uv.sources]
databricks-target = { path = "python/databricks-target" }
