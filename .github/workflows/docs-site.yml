# The docs site, AND the gates that decide whether it is fit to publish.
#
# The gates live here rather than in ci.yml because of what each workflow is
# allowed to skip. ci.yml now ignores docs-only changes -- an 18-job matrix that
# pulls container images has nothing to say about a paragraph -- and
# `check_docs_links.py` used to be a step inside its `test` job, so leaving it
# there would have meant the doc gate never ran on the changes it exists to
# check. The paths above are therefore the union of what the SITE needs and
# what the GATES read: README.md and SECURITY.md because the link checker
# validates the README's links into docs/, and the two scripts themselves
# because a change to a checker has to re-run it.
#
# `check_witnesses.py` runs in BOTH workflows on purpose. It reads
# docs/witnesses.json, docs/parity.md AND the names of Go tests, so either side
# can break it: a renamed Go test is a code change ci.yml sees, and an edited
# witnesses.json is a docs change only this workflow sees. Four duplicated
# lines, two correct triggers, no gap between them.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_witnesses.py'
      - 'scripts/check_landing_page.py'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_landing_page.py'
      - 'Makefile'
      - 'website/published-routes.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check. Build only: the deploy job
  # is skipped below.
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_witnesses.py'
      - 'scripts/check_landing_page.py'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_landing_page.py'
      - 'Makefile'
      - 'website/published-routes.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR builds get their own group so they cannot cancel a queued main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, and deliberately NOT a dependency of `build`: a dangling link and a
  # broken Astro build are independent failures, and seeing both in one run
  # beats discovering the second after fixing the first. `deploy` waits for
  # both, so neither can publish past the other.
  gates:
    name: Doc links, sidebar and witness map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The site build does NOT catch a dangling intra-doc link: measured, it
      # exits 0 and publishes a 404. Nor can it see a page missing from the
      # sidebar, which is published but unreachable by navigation.
      - name: Doc links and sidebar
        run: python3 scripts/check_docs_links.py --strict
      - name: Witness map
        run: python3 scripts/check_witnesses.py

  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
      # ONE STEP, AND IT IS THE ONE A DEVELOPER RUNS. `make docs-serve` builds
      # with this same target and then serves the result at the paths it
      # publishes under, so what is previewed locally is what deploys from
      # here. Spelling the sequence out in YAML instead is how the two drift:
      # the local recipe is the one nobody updates, and it is also the only one
      # anyone looks at before pushing.
      #
      # What it runs, and why each part is not redundant, is documented at the
      # target in the Makefile. In short: the doc links (the Astro build exits
      # 0 on a dangling one and publishes a 404), the Starlight build, the
      # assembler with its pre-move route oracle and its self-test, and the
      # landing page, which Astro never sees.
      - run: make docs-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    needs: [build, gates]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
