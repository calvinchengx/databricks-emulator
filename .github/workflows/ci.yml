name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Build, vet & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage floor (85%)
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 85) ? 1 : 0 }'
      - name: Witness map
        run: python3 scripts/check_witnesses.py

  e2e-sdk:
    name: Unmodified databricks-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r e2e/sdk/requirements.txt
      - run: python3 e2e/sdk/run.py

  e2e-terraform:
    name: Unmodified databricks/databricks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - run: python3 e2e/terraform/run.py

  e2e-engine:
    name: Unmodified SDK + Sail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: pip install -r e2e/sdk/requirements.txt
      - run: python3 e2e/engine/run.py
