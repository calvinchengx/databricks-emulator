name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Build, vet & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: |
          pkgs=$(go list ./... | grep -v '/internal/hs2/cliservice$')
          coverpkg=$(echo "$pkgs" | paste -sd, -)
          go test -coverpkg="$coverpkg" -coverprofile=cover.out ./...
      - name: Coverage floor (85%)
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 85) ? 1 : 0 }'
      # go test alone cannot see a data race. The jobs runner shipped one to
      # main unnoticed because nothing here ran with -race.
      # -count raises the odds of catching a rare race; it does not make
      # detection certain. Both races this gate has found so far surfaced
      # roughly one run in eight, so a single pass let them through far more
      # often than it caught them.
      - name: Race detector
        run: go test -count=5 -race $(go list ./... | grep -v '/internal/hs2/cliservice$')
      - name: Witness map
        run: python3 scripts/check_witnesses.py

  e2e-sdk:
    name: Unmodified databricks-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - run: uv run --frozen --group sdk python e2e/sdk/run.py

  e2e-cli:
    name: Unmodified databricks CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 e2e/cli/run.py

  e2e-terraform:
    name: Unmodified databricks/databricks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - run: python3 e2e/terraform/run.py

  e2e-engine:
    name: Unmodified SDK + Connect + Sail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group engine python e2e/engine/run.py

  e2e-delta:
    name: Sail writes Delta; delta-rs confirms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group delta python e2e/delta/run.py

  e2e-delta-jvm:
    name: JVM Spark writes Delta; delta-rs confirms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - run: uv run --frozen --group delta python e2e/delta-jvm/run.py

  e2e-uc:
    name: Unmodified SDK + UC OSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - run: uv run --frozen --group sdk python e2e/uc/run.py

  e2e-sql:
    name: Unmodified databricks-sql-connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group sql python e2e/sql/run.py

  e2e-databricks-target:
    name: databricks-target toggle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group target pytest python/databricks-target/tests -q
      - run: uv run --frozen --group target python e2e/databricks-target/run.py

  e2e-dbt:
    name: Unmodified dbt-databricks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group dbt python e2e/dbt/run.py

  # dbt as a JOB, which e2e-dbt does not cover: there dbt runs on the runner and
  # dials the warehouse itself. Here nothing on the runner has dbt at all -- the
  # `delta` group carries none -- so a passing run is dbt executing inside the
  # statement agent, which is the thing dbt_task claims to do.
  e2e-dbt-task:
    name: Jobs dbt_task runs dbt on the agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group delta python e2e/dbt-task/run.py

  # if/else decided by the emulator, driven by the unmodified SDK, and read back
  # off the disk by delta-rs. The row was green on Go tests alone until now.
  e2e-condition-task:
    name: Jobs condition_task picks the branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group delta python e2e/condition-task/run.py

  e2e-dbt-uc:
    name: Unmodified dbt-databricks (Unity Catalog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: uv run --frozen --group dbt python e2e/dbt-uc/run.py
