# DOCS-ONLY CHANGES SKIP THIS WORKFLOW.
#
# The list below is the same in ci.yml, lint.yml, make-targets.yml,
# security.yml and codeql.yml, and it has to stay that way: a change that some
# of them ignore and others do not produces a half-run whose green is harder to
# read than either outcome. `paths-ignore` means "run unless EVERY changed file
# matches", so a PR touching one Go file and forty markdown files still runs
# everything here. Only a genuinely docs-only change skips.
#
# What still covers the skipped case: docs-site.yml builds the site and runs
# `check_docs_links.py --strict`, `check_witnesses.py` and
# `check_landing_page.py` on exactly these paths, so the docs AND the hand-
# written landing page in site/ are gated by the workflow that publishes them.
#
# Note `docs/**` also covers docs/witnesses.json, which is NOT markdown and IS
# checked -- by docs-site.yml, for the same reason.
name: Make targets

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      # '**.md', not '**/*.md'. GitHub's '**' matches any characters
      # INCLUDING '/', so '**/*.md' requires a literal slash and would not
      # match README.md at the root -- the exact file this is here for.
      - '**.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      # '**.md', not '**/*.md'. GitHub's '**' matches any characters
      # INCLUDING '/', so '**/*.md' requires a literal slash and would not
      # match README.md at the root -- the exact file this is here for.
      - '**.md'

permissions:
  contents: read

jobs:
  make-targets:
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - name: make help (from the platform's native shell)
        run: make help
      - name: Witness map
        shell: bash
        run: python3 scripts/check_witnesses.py
      - name: Every target expands
        shell: bash
        run: |
          set -euo pipefail
          for t in help doctor build test e2e e2e-cli e2e-terraform e2e-engine e2e-delta e2e-delta-jvm e2e-uc e2e-sql e2e-databricks-target e2e-dbt e2e-dbt-uc clean witnesses; do
            echo "=== make -n $t ==="
            make -n "$t"
          done
      - name: make test
        shell: bash
        run: make test
      - name: make doctor
        if: runner.os == 'Linux'
        run: make doctor
      - name: docker build
        if: runner.os == 'Linux'
        run: docker build -t databricks-emulator:ci .
