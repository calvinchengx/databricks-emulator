# ruff and ty, as their own workflow.
#
# Neither ran here before. ruff had no configuration at all in this repo, and
# turning it on found real defects rather than style noise: an f-string with no
# placeholders, unused imports, and in snowflake-emulator a dict key defined
# twice whose first definition was dead text contradicting the live one.
#
# ty runs inside a SYNCED environment, which is not a detail. Unresolved
# imports mask everything downstream of them, so checking without the
# dependencies installed reports fewer problems, not more, and reads as health.
# DOCS-ONLY CHANGES SKIP THIS WORKFLOW.
#
# The list below is the same in ci.yml, lint.yml, make-targets.yml,
# security.yml and codeql.yml, and it has to stay that way: a change that some
# of them ignore and others do not produces a half-run whose green is harder to
# read than either outcome. `paths-ignore` means "run unless EVERY changed file
# matches", so a PR touching one Go file and forty markdown files still runs
# everything here. Only a genuinely docs-only change skips.
#
# What still covers the skipped case: docs-site.yml builds the site and runs
# `check_docs_links.py --strict`, `check_witnesses.py` and
# `check_landing_page.py` on exactly these paths, so the docs AND the hand-
# written landing page in site/ are gated by the workflow that publishes them.
#
# Note `docs/**` also covers docs/witnesses.json, which is NOT markdown and IS
# checked -- by docs-site.yml, for the same reason.
name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      # '**.md', not '**/*.md'. GitHub's '**' matches any characters
      # INCLUDING '/', so '**/*.md' requires a literal slash and would not
      # match README.md at the root -- the exact file this is here for.
      - '**.md'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      # '**.md', not '**/*.md'. GitHub's '**' matches any characters
      # INCLUDING '/', so '**/*.md' requires a literal slash and would not
      # match README.md at the root -- the exact file this is here for.
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    name: ruff and ty
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: ruff
        run: uvx ruff@0.15.22 check .

      - name: ty
        run: uv run --frozen --group sdk --group engine --group delta --group sql --group target --with ty ty check
