# Secret-gated real-workspace conformance for databricks-target.
# Not a PR check. Mirrors fabric-emulator's real-fabric.yml: the same
# unit suite plus warehouse-by-name resolution, with only
# DATABRICKS_TARGET and credentials differing from e2e/databricks-target.
#
# Required repository secrets: DATABRICKS_HOST, DATABRICKS_TOKEN,
# DATABRICKS_WAREHOUSE. Optional: DATABRICKS_CATALOG.

name: Real Databricks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  conformance:
    name: databricks-target against a real workspace
    runs-on: ubuntu-latest
    steps:
      # The gate is a STEP, not `jobs.<id>.if`. GitHub does not expose the
      # secrets context to a job-level condition, so the old guard made the
      # whole workflow invalid: it failed to evaluate, ran ZERO jobs, and
      # showed red against every push. A leg that has never executed once is
      # worse than an absent one, because the red looked like a real result.
      - name: Check secrets are configured
        id: gate
        env:
          SECRET_SET: ${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' && secrets.DATABRICKS_WAREHOUSE != '' }}
        run: |
          echo "run=$SECRET_SET" >> "$GITHUB_OUTPUT"
          if [ "$SECRET_SET" != "true" ]; then
            echo "::warning::DATABRICKS_HOST / DATABRICKS_TOKEN / DATABRICKS_WAREHOUSE are not set. Every step below is skipped, so this run proves NOTHING about real Databricks. A green tick here means 'not configured'."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          version: "0.12.3"
      - if: steps.gate.outputs.run == 'true'
        run: uv run --frozen --group target pytest python/databricks-target/tests -q
      - name: Resolve the named warehouse
        if: steps.gate.outputs.run == 'true'
        env:
          DATABRICKS_TARGET: real
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE: ${{ secrets.DATABRICKS_WAREHOUSE }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          uv run --frozen --group target python -c "
          from databricks_target import target
          t = target(fresh=True)
          assert t.is_real and t.tls_verify
          wh = t.warehouse()
          print('resolved', t.host, wh.name, wh.id, wh.http_path)
          "
