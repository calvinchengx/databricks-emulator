name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  make-targets:
    uses: ./.github/workflows/make-targets.yml

  image:
    name: Docker image to GHCR
    needs: make-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  target-wheel:
    name: databricks-target wheel → the release
    needs: make-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and prove the wheel
        run: python3 scripts/build_target_wheel.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Attach the wheel to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          gh release upload "$tag" dist/target/*.whl --clobber

  dispatch:
    name: Tell contoso-databricks-platform to verify this release
    needs: [image, target-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.ACCEPTANCE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ACCEPTANCE_DISPATCH_TOKEN is not set — the release " \
                 "shipped but nothing downstream was told. The consumer's daily " \
                 "cron still verifies the pin. Add a PAT with contents:write on " \
                 "calvinchengx/contoso-databricks-platform to dispatch."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh api repos/calvinchengx/contoso-databricks-platform/dispatches \
            -f event_type=databricks-emulator-release \
            -F "client_payload[version]=$version" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
          echo "dispatched databricks-emulator-release for $version"
